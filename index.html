<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mote — Coming Soon</title>
  <meta name="description" content="Mote is coming soon.">
  <meta name="theme-color" content="#080F12">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%23080F12'/%3E%3Cpath d='M14 42h15V27h21' fill='none' stroke='%23418727' stroke-width='8' stroke-linecap='square'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #080F12;
      --paper: #080F12;
      --acid: #418727;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #F2F3F1;
      color: var(--paper);
      font-family: Montserrat, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(42rem, calc(100% - 3rem));
      padding: 3rem 0;
      text-align: center;
    }

    img {
      display: block;
      width: min(25rem, 82vw);
      height: auto;
      margin: 0 auto 2.25rem;
    }

    p {
      margin: 0;
      color: var(--acid);
      font-size: clamp(.8rem, 2vw, .95rem);
      font-weight: 800;
      letter-spacing: .24em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <img src="assets/mote-logo-soft.png" alt="Mote">
    <p>Coming soon</p>
  </main>
</body>
</html>
